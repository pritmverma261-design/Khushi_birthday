<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#130817">
<title>Happy Birthday Khushi ❤️</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
min-height:100%;
font-family:system-ui,-apple-system,Segoe UI,sans-serif;
background:#100713;
color:white
}

body{
overflow-x:hidden;
background:radial-gradient(circle at 50% -10%,#61214f 0,#241027 34%,#0d0710 72%)
}

#stars{
position:fixed;
inset:0;
pointer-events:none;
background-image:
radial-gradient(#fff9 1px,transparent 1px),
radial-gradient(#fff6 1px,transparent 1px);
background-size:53px 53px,89px 89px;
background-position:10px 20px,35px 60px;
opacity:.25
}

main{
position:relative;
max-width:720px;
margin:auto;
min-height:100vh
}

.screen{
display:none;
min-height:100vh;
padding:46px 20px 70px;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center
}

.screen.active{
display:flex;
animation:in .55s ease
}

@keyframes in{
from{opacity:0;transform:translateY(18px)}
to{opacity:1;transform:none}
}

.pill,.step{
font-size:11px;
letter-spacing:2px;
color:#ffd7e9;
border:1px solid #fff2;
border-radius:999px;
padding:9px 14px;
background:#fff1;
backdrop-filter:blur(8px)
}

h1{
font-size:clamp(48px,14vw,92px);
line-height:.9;
margin:24px 0 14px;
letter-spacing:-3px;
background:linear-gradient(90deg,#fff,#ffc8e0,#fff);
-webkit-background-clip:text;
color:transparent
}

h1 span{color:#ffb6d6}

h2{
font-size:clamp(28px,7vw,46px);
margin:18px 0 8px;
line-height:1.05
}

h2 span{color:#ffb7d7}

.soft{
color:#e8cfdd;
opacity:.78;
line-height:1.6
}

.primary,.ghost{
border:0;
border-radius:999px;
padding:15px 24px;
font-size:16px;
font-weight:700;
cursor:pointer;
touch-action:manipulation
}

.primary{
margin-top:22px;
color:#2a1020;
background:linear-gradient(90deg,#ffd3e6,#fff0f6);
box-shadow:0 12px 35px #ff80b533
}

.ghost{
margin-top:22px;
background:#fff1;
color:#ffe7f2;
border:1px solid #fff2
}

.hidden{display:none!important}

/* BALLOONS */

.balloon-field{
position:relative;
width:100%;
height:55vh;
min-height:380px;
max-height:560px;
margin:10px 0
}

.balloon{
position:absolute;
width:66px;
height:82px;
padding:0;
border:0;
border-radius:50% 50% 46% 46%;
cursor:pointer;
touch-action:manipulation;
-webkit-tap-highlight-color:transparent;
user-select:none;
z-index:5;
box-shadow:
inset -9px -10px 0 #0002,
0 10px 28px #0005;<body>
<div id="stars"></div><div id="confetti"></div>
<main>
<section class="screen active" id="welcome">
<div class="pill">✨ A LITTLE SURPRISE FOR YOU</div>
<h1>Happy Birthday<br><span>Khushi</span> ❤️</h1>
<p class="soft">Someone made this little world just for you.</p>
<button class="primary" id="start">Tap to open 🎁</button>
</section>

<section class="screen" id="balloons">
<div class="step">01 · POP THE BALLOONS</div><h2>Make a wish first 🎈</h2><p class="soft">Tap every balloon.</p>
<div class="balloon-field" id="balloonField"></div><p class="counter"><span id="popped">0</span> / 8 popped</p>
</section>

<section class="screen" id="cake">
<div class="step">02 · YOUR CAKE</div><h2>A cake made for <span>Khushi</span> 🎂</h2>
<div class="cake-wrap"><div class="flame-row"><button class="flame">🕯️</button><button class="flame">🕯️</button><button class="flame">🕯️</button></div>
<div class="cake"><div class="icing">Happy Birthday</div><strong>Khushi</strong><div class="cake-line"></div></div><div class="plate"></div></div>
<p class="soft">Tap all three candles to blow them out ✨</p><button class="primary hidden" id="cakeNext">Open your letter 💌</button>
</section>

<section class="screen" id="letter">
<div class="step">03 · A LETTER FOR YOU</div>
<div class="letter-card"><div class="mini">For Khushi ❤️</div><h2>Dear Khushi,</h2>
<p>Aaj ka din thoda aur special hai, kyunki aaj <b>tumhara birthday</b> hai. 🌸</p>
<p>Tumhari smile mein ek alag hi sukoon hai, aur tumhari presence ordinary moments ko bhi beautiful bana deti hai. Bas dil se ye wish hai ki tumhari life hamesha happiness, success, pyaar aur bahut saari khoobsurat yaadon se bhari rahe. ✨</p>
<p>Jo dreams tum dekhti ho, woh ek-ek karke sach hote jaayein. Aur haan… <b>aise hi hamesha smile karti rehna.</b> ❤️</p>
<p class="sign">Happy Birthday, Khushi! 🎂<br>With lots of love & good wishes 🫶</p></div>
<button class="primary" id="memories">One last surprise 📸</button>
</section>

<section class="screen" id="memoriesScreen">
<div class="step">04 · YOUR MEMORIES</div><h2>Two little moments, saved here ❤️</h2>
<div class="photos"><img src="khushi1.jpg" alt="Khushi"><img src="khushi2.jpg" alt="Khushi"></div>
<div class="final"><div class="big-heart">❤️</div><h2>Keep smiling, Khushi.</h2><p>Today, tomorrow and every day after that. ✨</p><div class="date">27 AUGUST · YOUR DAY</div></div>
<button class="ghost" id="replay">Play again ↻</button>
</section>
</main>

<script>
const S={welcome:welcome,balloons:balloons,cake:cake,letter:letter,memoriesScreen:memoriesScreen};
function show(n){Object.values(S).forEach(x=>x.classList.remove('active'));S[n].classList.add('active');scrollTo(0,0);if(n==='balloons')setup();}
function confetti(n=60){const c=document.getElementById('confetti');c.innerHTML='';for(let i=0;i<n;i++){let p=document.createElement('i');p.className='piece';p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*1.5+'s';p.style.background=`hsl(${Math.random()*360},90%,78%)`;c.appendChild(p)}setTimeout(()=>c.innerHTML='',6500)}
start.onclick=()=>show('balloons');
function setup(){const f=balloonField;f.innerHTML='';let count=0;const colors=['#ff7eb6','#8fd3ff','#ffd36b','#b99cff','#ff9b8a','#77e5c0','#ffcfed','#a7b7ff'];for(let i=0;i<8;i++){let b=document.createElement('button');b.className='balloon';b.style.background=colors[i];b.style.left=(8+Math.random()*78)+'%';b.style.top=(4+Math.random()*78)+'%';b.onclick=()=>{if(b.classList.contains('popped'))return;b.classList.add('popped');popped.textContent=++count;confetti(8);if(count===8)setTimeout(()=>show('cake'),650)};f.appendChild(b)}}
document.querySelectorAll('.flame').forEach(x=>x.onclick=()=>{x.classList.toggle('off');if([...document.querySelectorAll('.flame')].every(y=>y.classList.contains('off'))){confetti(90);cakeNext.classList.remove('hidden')}});
cakeNext.onclick=()=>show('letter');memories.onclick=()=>{show('memoriesScreen');confetti(90)};replay.onclick=()=>show('welcome');
</script>
</body>
</html>
